[package]
name = "heft-mft"
version.workspace = true
edition = "2021"
rust-version = "1.79"
description = "Windows MFT-based disk usage scanner that produces .heft files"
license = "MIT"
repository = "https://github.com/Kalmarv/heft"
publish = false  # the crates.io names wait for a transfer from an old account

[dependencies]
heft-format = { version = "0.3.1", path = "../heft-format" }
clap = { version = "4", features = ["derive"] }
ntfs = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.dist]
# not on crates.io yet, but each release has its binary, for Windows
dist = true
targets = ["x86_64-pc-windows-msvc"]
