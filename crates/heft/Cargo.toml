[package]
name = "heft"
version.workspace = true
edition = "2021"
rust-version = "1.79"
description = "Fast disk usage scanner with mtime tracking"
license = "MIT"
repository = "https://github.com/Kalmarv/heft"
publish = false  # the crates.io names wait for a transfer from an old account
keywords = ["disk-usage", "du", "filesystem", "lmdb"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
heft-format = { version = "0.3.1", path = "../heft-format" }
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
heed = "0.20"
leb128 = "0.2"
serde_json = "1"
crossbeam-channel = "0.5"
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "index"
harness = false

[package.metadata.dist]
# not on crates.io yet, but each release has its binary: heft is Unix-only (heft-mft scans on Windows)
dist = true
targets = ["x86_64-unknown-linux-gnu"]
