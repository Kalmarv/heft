[package]
name = "dux"
version = "0.1.0"
edition = "2021"
description = "Fast disk usage scanner with mtime tracking"

[dependencies]
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
heed = "0.20"
leb128 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
zstd = "0.13"
crossbeam-channel = "0.5"

[profile.release]
debug = true
